services:
  patchpilot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./traces:/app/traces
      - ./chroma_data:/app/chroma_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
